<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Protecție combinată: clor și UV</title>
  <desc id="d">Clorul distruge adenovirusul, UV-ul distruge Cryptosporidium, iar împreună acoperă și rotavirusul, hepatita A, streptococul, Giardia, Legionella, E. coli și poliovirusul.</desc>
  <defs>
    <radialGradient id="gc" cx=".4" cy=".45" r=".7"><stop offset="0" stop-color="#e3f6fb"/><stop offset="1" stop-color="#9cd2f0"/></radialGradient>
    <radialGradient id="gu" cx=".6" cy=".45" r=".7"><stop offset="0" stop-color="#e3f6fb"/><stop offset="1" stop-color="#7be3f5"/></radialGradient>
  </defs>
  <rect width="760" height="360" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- protecție combinată -->
    <path d="M40 46v-14h680v14" fill="none" stroke="#0b2d4f" stroke-width="2"/>
    <text x="380" y="24" font-size="22" font-weight="700" fill="#0b2d4f" letter-spacing="1">PROTECȚIE COMBINATĂ: CLOR + UV</text>

    <!-- ovale -->
    <ellipse cx="290" cy="196" rx="250" ry="128" fill="url(#gc)" fill-opacity=".85" stroke="#0e6fb8" stroke-width="3" stroke-dasharray="10 7"/>
    <ellipse cx="470" cy="196" rx="250" ry="128" fill="url(#gu)" fill-opacity=".6" stroke="#22c3e6" stroke-width="3"/>

    <!-- etichete -->
    <text x="135" y="142" font-size="24" font-weight="700" fill="#0e6fb8">CLOR</text>
    <text x="625" y="142" font-size="24" font-weight="700" fill="#0b8fb0">UV</text>

    <!-- doar clor -->
    <g fill="#0b2d4f" font-size="19">
      <circle cx="120" cy="196" r="7"/><text x="120" y="226">Adenovirus</text>
      <!-- doar UV -->
      <circle cx="640" cy="196" r="7"/><text x="640" y="226">Cryptosporidium</text>
      <!-- amândouă -->
      <circle cx="320" cy="122" r="7"/><text x="320" y="152">Hepatita A</text>
      <circle cx="440" cy="122" r="7"/><text x="440" y="152">Streptococ</text>
      <circle cx="290" cy="194" r="7"/><text x="290" y="224">Rotavirus</text>
      <circle cx="470" cy="194" r="7"/><text x="470" y="224">Giardia</text>
      <circle cx="320" cy="262" r="7"/><text x="320" y="292">Poliovirus</text>
      <circle cx="400" cy="232" r="7"/><text x="400" y="262" font-style="italic">E. coli</text>
      <circle cx="470" cy="262" r="7"/><text x="470" y="292">Legionella</text>
    </g>
  </g>
</svg>
